<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7ECEA">
<title>Pocket Ledger</title>
<style>
  :root{
    --bg:#E7ECEA;       /* mist */
    --paper:#F7F9F8;    /* sheet surface */
    --ink:#1D2A2E;      /* text */
    --muted:#66767A;
    --line:#CFD8D6;
    --accent:#2E5E73;   /* slate teal */
    --danger:#A63D2F;
    --field:#FFFFFF;    /* inputs & chips */
    --track:#D7DEDC;    /* empty ring */
    --on-accent:#FFFFFF;/* text on accent buttons (set by JS for contrast) */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 96px}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px}
  .month{display:flex;align-items:center;gap:4px}
  .month h1{font-size:1.15rem;font-weight:600;margin:0;min-width:9.5ch;text-align:center}
  .icon{background:none;border:0;width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;font-size:1.2rem;color:var(--muted)}
  .icon:active{background:var(--line)}

  /* The one memorable element: the ring */
  .ring-wrap{position:relative;width:min(78vw,300px);margin:12px auto 8px}
  .ring-wrap svg{display:block;width:100%;height:auto}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;pointer-events:none}
  .total{font-size:2.3rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring-center small{color:var(--muted);font-size:.9rem}

  main{max-width:560px;margin:0 auto;padding:0 16px}
  .legend{list-style:none;margin:8px 0 24px;padding:0}
  .legend li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;
    padding:10px 4px;border-bottom:1px solid var(--line)}
  .legend li button{all:unset;display:contents;cursor:pointer}
  .dot{width:12px;height:12px;border-radius:3px}
  .legend .amt{font-variant-numeric:tabular-nums;font-weight:600}
  .legend .pct{color:var(--muted);font-weight:400;margin-left:8px;font-size:.9rem}
  .legend li.active{background:var(--paper);border-radius:6px}

  h2{font-size:1rem;margin:0 0 6px;color:var(--muted);font-weight:500}
  .day{margin-bottom:18px}
  .day-head{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;padding:0 4px 4px}
  .item{display:flex;align-items:center;gap:12px;background:var(--paper);padding:12px 14px;
    border-bottom:1px solid var(--line)}
  .day .item:first-of-type{border-radius:10px 10px 0 0}
  .day .item:last-of-type{border-radius:0 0 10px 10px;border-bottom:0}
  .day .item:only-of-type{border-radius:10px}
  .item .info{flex:1;min-width:0}
  .item .cat{font-weight:500}
  .item .note{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .val{font-variant-numeric:tabular-nums;font-weight:600}
  .item .del{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px 6px}

  .empty{text-align:center;color:var(--muted);padding:28px 12px}

  .fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));
    width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);
    font-size:2rem;line-height:1;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}

  /* Bottom sheets */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);
    border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .25s ease;max-height:88vh;overflow:auto}
  .open .scrim{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  @media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

  .amount-input{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);margin-bottom:18px}
  .amount-input span{font-size:1.8rem;color:var(--muted)}
  .amount-input input{border:0;background:none;font-size:2.4rem;font-weight:700;width:100%;padding:4px 0;outline:none}
  label.f{display:block;font-size:.88rem;color:var(--muted);margin:14px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:7px 14px;
    display:inline-flex;align-items:center;gap:8px}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .chip.add{border-style:dashed;color:var(--muted)}
  .txt{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--field)}
  .row{display:flex;gap:10px;margin-top:22px}
  .btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--accent);color:var(--on-accent)}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
  .btn.danger{background:none;border:1.5px solid var(--danger);color:var(--danger)}
  .err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin-top:8px}

  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .cat-row input[type=color]{width:34px;height:34px;border:0;padding:0;background:none}
  .cat-row .name{flex:1}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;
    display:flex;gap:14px;align-items:center;white-space:nowrap}
  .toast.show{opacity:1;pointer-events:auto}
  .toast button{background:none;border:0;color:var(--paper);text-decoration:underline;font-weight:600;padding:2px 4px}
  .toast button[hidden]{display:none}
  #askSheet .sheet{padding-top:24px}
  #askMsg{margin:0 0 4px;font-size:1rem}
  .newcat-row{display:flex;gap:8px;margin-top:10px}
  .newcat-row[hidden]{display:none}
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .theme{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:none;text-align:left}
  .theme[aria-pressed="true"]{border-color:var(--ink)}
  .theme .sw{display:flex;height:40px}
  .theme .sw i{flex:1}
  .theme span{display:block;padding:6px 8px;font-size:.85rem}
  .accent-row{display:flex;align-items:center;gap:12px;margin-top:12px}
  .accent-row input[type=color]{width:44px;height:36px;border:0;padding:0;background:none}
  .linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
</style>
</head>
<body>

<header>
  <div class="month">
    <button class="icon" id="prev" aria-label="Previous month">‹</button>
    <h1 id="monthLabel"></h1>
    <button class="icon" id="next" aria-label="Next month">›</button>
  </div>
  <button class="icon" id="openSettings" aria-label="Categories and settings">⚙</button>
</header>

<div class="ring-wrap">
  <svg id="ring" viewBox="0 0 200 200" role="img" aria-label="Spending by category"></svg>
  <div class="ring-center">
    <div class="total" id="total">₹0</div>
    <small id="ringSub">spent this month</small>
  </div>
</div>

<main>
  <ul class="legend" id="legend"></ul>
  <h2 id="listTitle">Expenses</h2>
  <div id="list"></div>
</main>

<button class="fab" id="openAdd" aria-label="Add expense">+</button>

<!-- Add expense sheet -->
<div id="addSheet">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="Add expense">
    <div class="amount-input">
      <span id="curSym">₹</span>
      <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
    </div>
    <label class="f">Category</label>
    <div class="chips" id="catChips"></div>
    <div class="newcat-row" id="newCatRow" hidden>
      <input class="txt" id="newCatInline" type="text" maxlength="24" placeholder="Category name">
      <button class="btn" id="newCatInlineAdd" style="flex:0 0 auto;padding:0 18px">Add</button>
    </div>
    <label class="f" for="note">Note (optional)</label>
    <input class="txt" id="note" type="text" maxlength="80" placeholder="e.g. Lunch with team">
    <label class="f" for="date">Date</label>
    <input class="txt" id="date" type="date">
    <div class="err" id="addErr"></div>
    <div class="row">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn" id="saveExpense">Save expense</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div id="setSheet">
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="Categories and settings">
    <h2>Categories</h2>
    <div id="catList"></div>
    <div class="row" style="margin-top:12px">
      <input class="txt" id="newCat" type="text" maxlength="24" placeholder="New category name">
      <button class="btn" id="addCat" style="flex:0 0 auto;padding:0 18px">Add</button>
    </div>
    <h2 style="margin-top:24px">Colour theme</h2>
    <div class="themes" id="themes"></div>
    <div class="accent-row">
      <input type="color" id="accentPick" aria-label="Custom accent colour">
      <label for="accentPick">Custom accent colour</label>
      <button class="linkbtn" id="accentReset">Reset</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="exportCsv">Export CSV</button>
      <button class="btn danger" id="wipe">Delete all data</button>
    </div>
    <div class="row"><button class="btn" data-close>Done</button></div>
  </div>
</div>

<!-- In-app confirm dialog (native browser popups are often blocked in WebViews) -->
<div id="askSheet">
  <div class="scrim" id="askScrim"></div>
  <div class="sheet" role="alertdialog" aria-labelledby="askMsg">
    <p id="askMsg"></p>
    <div class="row">
      <button class="btn ghost" id="askNo">Cancel</button>
      <button class="btn danger" id="askYes">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
(() => {
  // ---------- Storage (localStorage on device; falls back to memory if unavailable) ----------
  const KEY = 'pocket-ledger-v1';
  let memoryStore = null;
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); }
    catch (e) { if (memoryStore) return memoryStore; }
    return null;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { memoryStore = state; }
  }

  const PALETTE = ['#2E5E73','#C9803B','#6B8F5A','#A8555F','#7A6AA8','#3F8F8C','#B5A04A','#5C6B7A','#C46A8E','#8A6A4F'];
  const defaults = {
    theme: 'mist',
    accent: null, // custom accent override
    categories: [
      {id:'c1', name:'Food', color:PALETTE[1]},
      {id:'c2', name:'Transport', color:PALETTE[0]},
      {id:'c3', name:'Shopping', color:PALETTE[3]},
      {id:'c4', name:'Bills', color:PALETTE[4]},
      {id:'c5', name:'Health', color:PALETTE[2]},
      {id:'c6', name:'Fun', color:PALETTE[6]},
    ],
    expenses: [] // {id, amount, catId, note, date:'YYYY-MM-DD'}
  };
  let state = load() || JSON.parse(JSON.stringify(defaults));
  if (!state.theme) state.theme = 'mist';
  delete state.currency; // rupees only

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const fmt = n => '₹' + n.toLocaleString('en-IN', {maximumFractionDigits: 2});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const catById = id => state.categories.find(c => c.id === id) || {name:'Uncategorised', color:'#9AA5A8'};

  // ---------- Themes ----------
  const THEMES = {
    mist:     {name:'Mist',     bg:'#E7ECEA', paper:'#F7F9F8', ink:'#1D2A2E', muted:'#66767A', line:'#CFD8D6', accent:'#2E5E73', danger:'#A63D2F', field:'#FFFFFF', track:'#D7DEDC'},
    sand:     {name:'Sand',     bg:'#EEE8DF', paper:'#FAF7F2', ink:'#2B2520', muted:'#776B60', line:'#DCD2C5', accent:'#8A5A3B', danger:'#A63D2F', field:'#FFFFFF', track:'#E2D8CB'},
    blossom:  {name:'Blossom',  bg:'#F2E6EB', paper:'#FCF6F8', ink:'#2E1F26', muted:'#7B6370', line:'#E2CDD6', accent:'#A3456C', danger:'#A63D2F', field:'#FFFFFF', track:'#E8D6DE'},
    forest:   {name:'Forest',   bg:'#E2EAE0', paper:'#F5F9F4', ink:'#1E2A1D', muted:'#5F6F5C', line:'#C9D6C6', accent:'#3E6B38', danger:'#A63D2F', field:'#FFFFFF', track:'#D3DECF'},
    lavender: {name:'Lavender', bg:'#E8E6F2', paper:'#F7F6FC', ink:'#24213A', muted:'#6D6888', line:'#D3CFE6', accent:'#5B4FA6', danger:'#A63D2F', field:'#FFFFFF', track:'#DCD8EC'},
    midnight: {name:'Midnight', bg:'#11171B', paper:'#1A2227', ink:'#E4EBED', muted:'#8F9FA4', line:'#2B363C', accent:'#5FA8C7', danger:'#E07A6B', field:'#212B31', track:'#28333A'},
    charcoal: {name:'Charcoal', bg:'#161616', paper:'#202020', ink:'#EDEDED', muted:'#9E9E9E', line:'#333333', accent:'#E0A458', danger:'#E07A6B', field:'#282828', track:'#303030'},
    ocean:    {name:'Ocean',    bg:'#0E1924', paper:'#162431', ink:'#E2ECF4', muted:'#8BA3B6', line:'#253748', accent:'#4FB3A9', danger:'#E07A6B', field:'#1C2C3B', track:'#223344'},
  };

  // Pick black or white text for good contrast on a given colour
  function textOn(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    const lum = c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
    return (0.2126 * lum(r) + 0.7152 * lum(g) + 0.0722 * lum(b)) > 0.179 ? '#111111' : '#FFFFFF';
  }

  function applyTheme() {
    const t = THEMES[state.theme] || THEMES.mist;
    const accent = state.accent || t.accent;
    const s = document.documentElement.style;
    ['bg','paper','ink','muted','line','danger','field','track'].forEach(k => s.setProperty('--' + k, t[k]));
    s.setProperty('--accent', accent);
    s.setProperty('--on-accent', textOn(accent));
    document.querySelector('meta[name=theme-color]').setAttribute('content', t.bg);
    document.documentElement.style.colorScheme = textOn(t.bg) === '#FFFFFF' ? 'dark' : 'light';
  }

  function renderThemes() {
    $('themes').innerHTML = Object.entries(THEMES).map(([k, t]) => `
      <button class="theme" data-theme="${k}" aria-pressed="${state.theme === k}">
        <span class="sw"><i style="background:${t.bg}"></i><i style="background:${t.paper}"></i><i style="background:${t.accent}"></i></span>
        <span>${t.name}</span>
      </button>`).join('');
    $('accentPick').value = state.accent || (THEMES[state.theme] || THEMES.mist).accent;
  }

  let view = new Date(); view.setDate(1);
  let filterCat = null;       // tap a legend row to filter the list
  let selectedCat = null;     // chip selected in add sheet

  function toast(msg, undoFn) {
    const t = $('toast'), u = $('toastUndo');
    $('toastMsg').textContent = msg;
    u.hidden = !undoFn;
    u.onclick = undoFn ? () => { undoFn(); t.classList.remove('show'); } : null;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), undoFn ? 4000 : 1800);
  }

  // In-app yes/no dialog. Resolves true/false.
  function ask(message, yesLabel = 'Delete') {
    return new Promise(resolve => {
      $('askMsg').textContent = message;
      $('askYes').textContent = yesLabel;
      const s = $('askSheet'); s.classList.add('open');
      const done = v => { s.classList.remove('open'); $('askYes').onclick = $('askNo').onclick = $('askScrim').onclick = null; resolve(v); };
      $('askYes').onclick = () => done(true);
      $('askNo').onclick = $('askScrim').onclick = () => done(false);
    });
  }

  // ---------- Render ----------
  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

  function render() {
    $('monthLabel').textContent = view.toLocaleDateString('en-IN', {month:'long', year:'numeric'});
    const mk = monthKey(view);
    const monthExp = state.expenses.filter(e => e.date.startsWith(mk));
    const total = monthExp.reduce((s, e) => s + e.amount, 0);

    // Totals per category, largest first
    const byCat = {};
    monthExp.forEach(e => byCat[e.catId] = (byCat[e.catId] || 0) + e.amount);
    const rows = Object.entries(byCat).map(([id, amt]) => ({cat: catById(id), id, amt}))
                        .sort((a, b) => b.amt - a.amt);

    // Ring
    $('total').textContent = fmt(filterCat ? (byCat[filterCat] || 0) : total);
    $('ringSub').textContent = filterCat ? catById(filterCat).name : (monthExp.length ? `${monthExp.length} expense${monthExp.length > 1 ? 's' : ''}` : 'nothing spent yet');
    drawRing(rows, total);

    // Legend
    $('legend').innerHTML = rows.map(r => `
      <li class="${filterCat === r.id ? 'active' : ''}">
        <button data-filter="${r.id}" aria-label="Show only ${esc(r.cat.name)}">
          <span class="dot" style="background:${r.cat.color}"></span>
          <span>${esc(r.cat.name)}</span>
          <span class="amt">${fmt(r.amt)}<span class="pct">${Math.round(r.amt / total * 100)}%</span></span>
        </button>
      </li>`).join('');

    // List grouped by day
    const list = monthExp.filter(e => !filterCat || e.catId === filterCat)
                         .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    $('listTitle').textContent = filterCat ? `${catById(filterCat).name} expenses (tap the row above to clear)` : 'Expenses';
    if (!list.length) {
      $('list').innerHTML = `<div class="empty">No expenses this month. Tap + to add one.</div>`;
      return;
    }
    const groups = {};
    list.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
    $('list').innerHTML = Object.entries(groups).map(([date, items]) => {
      const d = new Date(date + 'T00:00');
      const label = date === today() ? 'Today' : d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
      const sum = items.reduce((s, e) => s + e.amount, 0);
      return `<div class="day"><div class="day-head"><span>${label}</span><span>${fmt(sum)}</span></div>` +
        items.map(e => { const c = catById(e.catId); return `
          <div class="item">
            <span class="dot" style="background:${c.color}"></span>
            <div class="info"><div class="cat">${esc(c.name)}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</div>
            <span class="val">${fmt(e.amount)}</span>
            <button class="del" data-del="${e.id}" aria-label="Delete expense">✕</button>
          </div>`; }).join('') + `</div>`;
    }).join('');
  }

  function drawRing(rows, total) {
    const R = 80, C = 2 * Math.PI * R, W = 22;
    let svg = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--track)" stroke-width="${W}"/>`;
    if (total > 0) {
      let offset = 0;
      const gap = rows.length > 1 ? 2 : 0;           // small gap between slices
      rows.forEach(r => {
        const len = r.amt / total * C;
        const dim = filterCat && filterCat !== r.id ? 0.25 : 1;
        svg += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${r.cat.color}" stroke-width="${W}"
          stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-offset}"
          transform="rotate(-90 100 100)" opacity="${dim}"/>`;
        offset += len;
      });
    }
    $('ring').innerHTML = svg;
  }

  function renderChips() {
    $('catChips').innerHTML = state.categories.map(c =>
      `<button class="chip" data-chip="${c.id}" aria-pressed="${selectedCat === c.id}">
        <span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('') +
      `<button class="chip add" data-chip="__new">+ New</button>`;
  }

  function renderCatList() {
    $('catList').innerHTML = state.categories.map(c => `
      <div class="cat-row">
        <input type="color" value="${c.color}" data-color="${c.id}" aria-label="Colour for ${esc(c.name)}">
        <span class="name">${esc(c.name)}</span>
        <button class="del icon" data-delcat="${c.id}" aria-label="Delete ${esc(c.name)}">✕</button>
      </div>`).join('');
    renderThemes();
  }

  // ---------- Sheets ----------
  function openSheet(id) { $(id).classList.add('open'); }
  function closeSheets() { document.querySelectorAll('.open').forEach(s => s.classList.remove('open')); }
  document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheets));

  function addCategory(name) {
    name = name.trim();
    if (!name) return null;
    const existing = state.categories.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    const c = {id: uid(), name, color: PALETTE[state.categories.length % PALETTE.length]};
    state.categories.push(c); persist();
    return c;
  }

  // ---------- Events ----------
  $('prev').onclick = () => { view.setMonth(view.getMonth() - 1); filterCat = null; render(); };
  $('next').onclick = () => { view.setMonth(view.getMonth() + 1); filterCat = null; render(); };

  $('openAdd').onclick = () => {
    $('amount').value = ''; $('note').value = ''; $('addErr').textContent = '';
    const now = new Date();
    // default date: today if viewing current month, else 1st of viewed month
    $('date').value = monthKey(view) === monthKey(now) ? today() : monthKey(view) + '-01';
    selectedCat = selectedCat || state.categories[0]?.id || null;
    $('newCatRow').hidden = true; $('newCatInline').value = '';
    renderChips(); openSheet('addSheet');
    setTimeout(() => $('amount').focus(), 250);
  };

  $('catChips').onclick = e => {
    const b = e.target.closest('[data-chip]'); if (!b) return;
    if (b.dataset.chip === '__new') {
      $('newCatRow').hidden = false; $('newCatInline').focus();
      return;
    }
    selectedCat = b.dataset.chip;
    renderChips();
  };
  $('newCatInlineAdd').onclick = () => {
    const c = addCategory($('newCatInline').value);
    if (!c) { $('newCatInline').focus(); return; }
    selectedCat = c.id; $('newCatInline').value = ''; $('newCatRow').hidden = true;
    $('addErr').textContent = ''; renderChips();
  };
  $('newCatInline').addEventListener('keydown', e => { if (e.key === 'Enter') $('newCatInlineAdd').click(); });

  $('saveExpense').onclick = () => {
    const amount = parseFloat($('amount').value);
    if (!(amount > 0)) { $('addErr').textContent = 'Enter an amount greater than 0.'; return; }
    if (!selectedCat) { $('addErr').textContent = 'Pick a category, or add one with + New.'; return; }
    if (!$('date').value) { $('addErr').textContent = 'Pick a date.'; return; }
    state.expenses.push({id: uid(), amount: Math.round(amount * 100) / 100, catId: selectedCat,
                         note: $('note').value.trim(), date: $('date').value});
    persist();
    const d = new Date($('date').value + 'T00:00'); view = new Date(d.getFullYear(), d.getMonth(), 1);
    closeSheets(); render(); toast('Expense saved');
  };
  $('amount').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveExpense').click(); });

  $('legend').onclick = e => {
    const b = e.target.closest('[data-filter]'); if (!b) return;
    filterCat = filterCat === b.dataset.filter ? null : b.dataset.filter; render();
  };

  $('list').onclick = e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const idx = state.expenses.findIndex(x => x.id === b.dataset.del);
    if (idx < 0) return;
    const [removed] = state.expenses.splice(idx, 1);
    persist(); render();
    toast('Expense deleted', () => { state.expenses.splice(idx, 0, removed); persist(); render(); });
  };

  $('openSettings').onclick = () => { renderCatList(); openSheet('setSheet'); };
  $('addCat').onclick = () => { if (addCategory($('newCat').value)) { $('newCat').value = ''; renderCatList(); } };
  $('newCat').addEventListener('keydown', e => { if (e.key === 'Enter') $('addCat').click(); });

  $('catList').addEventListener('input', e => {
    const id = e.target.dataset.color; if (!id) return;
    catById(id).color = e.target.value; persist(); render();
  });
  $('catList').onclick = async e => {
    const b = e.target.closest('[data-delcat]'); if (!b) return;
    const id = b.dataset.delcat, used = state.expenses.filter(x => x.catId === id).length;
    const msg = used ? `"${catById(id).name}" has ${used} expense(s). Delete the category and those expenses?` : `Delete "${catById(id).name}"?`;
    if (!(await ask(msg))) return;
    state.categories = state.categories.filter(c => c.id !== id);
    state.expenses = state.expenses.filter(x => x.catId !== id);
    if (selectedCat === id) selectedCat = null;
    if (filterCat === id) filterCat = null;
    persist(); renderCatList(); render();
  };

  $('themes').onclick = e => {
    const b = e.target.closest('[data-theme]'); if (!b) return;
    state.theme = b.dataset.theme; state.accent = null; persist(); applyTheme(); renderThemes();
  };
  $('accentPick').addEventListener('input', e => { state.accent = e.target.value; persist(); applyTheme(); });
  $('accentReset').onclick = () => { state.accent = null; persist(); applyTheme(); renderThemes(); };

  $('exportCsv').onclick = () => {
    const lines = [['date','category','amount','note']].concat(
      state.expenses.slice().sort((a,b) => a.date.localeCompare(b.date))
        .map(e => [e.date, catById(e.catId).name, e.amount, e.note]))
      .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
    const csv = lines.join('\n');
    // Share sheet works best inside the Android app; download is the fallback.
    const file = new File([csv], 'expenses.csv', {type:'text/csv'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:'Expenses'}).catch(() => {});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = 'expenses.csv'; a.click();
    }
  };

  $('wipe').onclick = async () => {
    if (!(await ask('Delete every expense and reset categories? This cannot be undone.', 'Delete all'))) return;
    const keep = {theme: state.theme, accent: state.accent}; // wiping data keeps your theme
    state = Object.assign(JSON.parse(JSON.stringify(defaults)), keep); persist(); filterCat = null; selectedCat = null;
    applyTheme(); renderCatList(); render(); toast('All data deleted');
  };

  applyTheme();
  render();
})();
</script>
</body>
</html>
